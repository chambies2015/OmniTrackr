name: Python Tests
permissions:
  contents: read

# Monthly work lands on branches named after the month (October-Updates,
# November-Updates, ...), so '*-Updates' covers every future month too.
on:
  push:
    branches: [ main, develop, '*-Updates' ]
  pull_request:
    branches: [ main, develop, '*-Updates' ]
  # Lets the suite be started by hand when GitHub drops a push or PR event.
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests with pytest
      run: |
        python -m pytest tests/ -v --tb=short --strict-markers --disable-warnings
      continue-on-error: false

  browser-tests:
    name: Browser behavior tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Run browser behavior tests
      run: node --test tests/*.cjs

