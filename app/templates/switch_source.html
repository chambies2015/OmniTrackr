  <link rel="stylesheet" href="/static/fonts.css?v=20261009-fonts-1">
  <style>
    body { min-height: 100vh; padding: 20px; }
    .content-container { background: var(--card-bg); border-radius: 16px; padding: 50px 40px; margin: 20px 0; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); border: 1px solid var(--border); color: var(--fg); line-height: 1.8; }
    @media (max-width: 768px) { .content-container { padding: 30px 20px; margin: 10px 0; } }
    .content-header { text-align: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 2px solid var(--border); }
    .content-header h1 { font-family: 'Poppins', sans-serif; font-size: 2.35rem; margin-bottom: 10px; color: var(--fg); }
    .content-header p, .content-section p, .content-section li, .content-section td { color: var(--fg-secondary); }
    .content-section { margin-bottom: 38px; scroll-margin-top: 24px; }
    .content-section h2 { font-family: 'Poppins', sans-serif; font-size: 1.75rem; margin-bottom: 15px; color: var(--primary); }
    .content-section h3 { font-size: 1.2rem; margin: 24px 0 10px; }
    .content-section ul, .content-section ol { margin-left: 20px; margin-bottom: 15px; }
    .content-section li { margin-bottom: 8px; }
    .content-section code { font-size: .92em; overflow-wrap: anywhere; }
    .switch-table-wrap { max-width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
    .switch-table { width: 100%; border-collapse: collapse; font-size: .95rem; line-height: 1.5; }
    .switch-table th, .switch-table td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
    .switch-table thead th { background: var(--bg); color: var(--fg); }
    .switch-table tbody tr:last-child th, .switch-table tbody tr:last-child td { border-bottom: 0; }
    .switch-table-wrap:focus-visible, .guide-jump a:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
    .guide-jump { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 24px 0 36px; }
    .guide-jump a { padding: 8px 0; }
    .guide-updated { font-size: .9rem; }
    .switch-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin: 0 0 36px; padding: 18px 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
    .switch-cta p { flex: 1 1 260px; margin: 0; color: var(--fg-secondary); }
    .switch-cta a { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 18px; border-radius: 999px; background: var(--primary); color: #fff; font-weight: 700; text-decoration: none; }
    .switch-cta a:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.public-reader .reader-shell .switch-cta a, .public-reader .reader-shell .switch-cta a:hover { color: #fff; text-decoration: none; }
    .back-link { display: inline-block; margin-bottom: 30px; color: var(--primary); text-decoration: none; font-weight: 500; }
  .switch-map { margin-top: 8px; }
.switch-map + p { margin-top: 16px; }
.switch-faq dt { margin-top: 18px; font-weight: 700; color: var(--fg); }
.switch-faq dd { margin: 6px 0 0; color: var(--fg-secondary); }
.switch-others { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 0; padding: 0; list-style: none; }
.switch-others li { margin: 0; }
.switch-others a { display: inline-flex; align-items: center; min-height: 40px; padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px; color: var(--fg); text-decoration: none; }
.switch-others a:hover { border-color: var(--primary); color: var(--primary); }
.switch-others a:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
</style>
{{STRUCTURED_DATA}}
